<!-- subject: {{SchoolName}} subscription reactivated -->
<h1 style="margin:0 0 16px;font-size:22px;color:#111827;">Subscription reactivated</h1>
<p style="margin:0 0 12px;">Hi {{ContactName}},</p>
<p style="margin:0 0 16px;">
  Access to the platform has been restored for <strong>{{SchoolName}}</strong>.
</p>
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="margin:0 0 20px;background:#f0fdf4;border:1px solid #bbf7d0;border-radius:8px;">
  <tr>
    <td style="padding:16px;">
      <p style="margin:0 0 8px;"><strong>Plan:</strong> {{PlanName}}</p>
      <p style="margin:0;"><strong>New period ends:</strong> {{EndDate}}</p>
    </td>
  </tr>
</table>
<table role="presentation" cellpadding="0" cellspacing="0" style="margin:0 0 20px;">
  <tr>
    <td style="border-radius:8px;background:#2563eb;">
      <a href="{{LoginUrl}}" style="display:inline-block;padding:12px 24px;color:#ffffff;text-decoration:none;font-weight:600;">
        Sign in
      </a>
    </td>
  </tr>
</table>
