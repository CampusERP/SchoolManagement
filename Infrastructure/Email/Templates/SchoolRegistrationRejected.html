<!-- subject: Update on your registration request for {{SchoolName}} -->
<h1 style="margin:0 0 16px;font-size:22px;color:#111827;">Registration request update</h1>
<p style="margin:0 0 12px;">Hi {{ContactName}},</p>
<p style="margin:0 0 16px;">
  After reviewing the registration request for <strong>{{SchoolName}}</strong>,
  we are unable to approve it at this time.
</p>
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="margin:0 0 20px;background:#fef2f2;border:1px solid #fecaca;border-radius:8px;">
  <tr>
    <td style="padding:16px;color:#991b1b;">
      <p style="margin:0 0 6px;"><strong>Reason</strong></p>
      <p style="margin:0;">{{Reason}}</p>
    </td>
  </tr>
</table>
<p style="margin:0 0 12px;">
  You are welcome to correct the details and submit a new request, or contact us at
  <a href="mailto:{{SupportEmail}}" style="color:#2563eb;">{{SupportEmail}}</a> if you have questions.
</p>
